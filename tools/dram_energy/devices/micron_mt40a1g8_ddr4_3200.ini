# Micron MT40A1G8 -- 8Gb (1 Gig x 8) DDR4-3200, speed grade -062E (22-22-22).
#
# Device parameters only; the energy equations live in dram_energy.py. Copy this
# file to add another DRAM model -- see README.md "Adding a DRAM model".
#
# EVERY value below is transcribed from a primary source, cited inline:
#   [DS]    Micron 8Gb DDR4 SDRAM component data sheet (MT40A1G8 / MT40A512M16),
#           doc CCMTD-1406124318-10419 Rev. L 12/2023. Currents from Table 151
#           "IDD, IPP, and IDDQ Current Limits - Rev E (0C <= TC <= 95C)",
#           column DDR4-3200, row Width = x8. Timings from Table 163.
#           https://www.alliancememory.com/wp-content/uploads/Micron_8gb-Commercial-ddr4-dram-Alliance_MT40A512M16TD-062ER-MT40A1G8AG-062ER_reduced.pdf
#   [JEDEC] JEDEC JESD79-4 DDR4 SDRAM standard (Sept 2012). Voltages Table 63;
#           tRFC1/tREFI refresh table; BL8 in section 4.3.
#           https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/196/JESD79_2D00_4.pdf
#   [SKH]   SK hynix 8Gb DDR4 SDRAM Rev 1.4 (Apr 2020), operating-frequency
#           table -- used only to corroborate the DDR4-3200 tRC/tRAS row.
#           https://product.skhynix.com/download.do?attNo=1638&attTypeCd=TRT06
#
# Die revision and temperature range matter: Rev E at 0-95C is the commercial
# part. Other revisions in [DS] differ by up to ~25% on IDD0 (Tables 148-153).

[device]
name     = Micron MT40A1G8, 8Gb x8, DDR4-3200 (-062E)
part     = MT40A1G8, die Rev E, 0C <= TC <= 95C
source   = Micron 8Gb DDR4 data sheet Rev. L 12/2023, Table 151 (currents) + Table 163 (timings); JESD79-4 (voltages, refresh, BL8)
verified = true

[organization]
# x8 device; a 64-bit rank is 8 of them. One BL8 burst = 8 transfers = 64B,
# exactly one cache line. [JEDEC] sec 4.3, MR0 A1:A0=00 -> BL8 fixed.
devices_per_rank = 8
burst_transfers  = 8
line_bits        = 512
# The data rate the currents and timings below describe. dram_energy.py rescales
# only the burst time for other rates and warns; add a profile for another grade.
data_rate_mtps   = 3200

[voltage_v]
# [JEDEC] Table 63 "Recommended DC Operating Conditions": 1.14 / 1.2 / 1.26.
vdd = 1.2
# Wordline boost supply, DDR4-only: 2.375 / 2.5 / 2.75. [JEDEC] Table 63,
# corroborated by [DS] ("VPP | Wordline supply | 2.375 | 2.5 | 2.750 | V").
vpp = 2.5

[current_ma]
# All per device, [DS] Table 151, DDR4-3200 column, x8 row.
idd0  = 49
idd2n = 34
idd3n = 45
idd4r = 184
idd4w = 155
# Datasheet symbol is IDD5R "(1X REF)". NOTE: Micron labels it "Distributed
# refresh current" in [DS] but "Burst refresh current (1x REF)" in its SODIMM
# datasheet -- the two readings imply different duty-cycle handling. We apply
# the TN-41-01 burst formula (scaled by tRFC/tREFI), which is the conservative
# (lower) reading. Refresh is a small, workload-independent term that is common
# to every configuration, so this ambiguity does not affect comparisons.
idd5b = 70
# IPP0 = IPP3N = IPP5R-adjacent = 3 mA in [DS]: the activate-specific VPP
# adder is BELOW the datasheet's 1 mA resolution. dram_energy.py therefore
# charges the full IPP0*tRC*VPP as an upper bound rather than subtracting the
# IPP background as the VDD term does. See README caveat 2 -- with the
# subtraction the VPP term would be ~0 and E_ACT would drop from 5.95 to
# 3.21 nJ, which only strengthens the "an activation is not expensive relative
# to a read" conclusion.
ipp0  = 3.0

[timing_ns]
# [DS] Table 163, -062E bin (22-22-22): tRCD = tRP = 13.75 ns, and tRC is
# specified as the formula tRAS + tRP = 32 + 13.75 = 45.75 ns. [SKH] prints
# the same row numerically: DDR4-3200 -XN 0.625 22 13.75 13.75 32 45.75.
tras  = 32
trc   = 45.75
# 8Gb density: tRFC1 = 350 ns (2Gb = 160, 4Gb = 260). [DS] Table 52 + [JEDEC].
trfc  = 350
# tREFI(base) = 7.8 us for 0C <= TC <= 85C, density-independent. [DS] + [JEDEC].
trefi = 7800

[io_pj_per_bit]
# Accessed DRAM device only (matches the IDD scope above: one rank, no
# cross-rank ODT -- the simulated system is 1 channel x 1 rank).
# [TN4007] Micron TN-40-07 "Calculating Memory Power for DDR4 SDRAM" Rev. B
# 8/18, Table 26 "Nominal I/O Termination Power Consumption", DDR4-2666
# example: pdqRD = 11.73 mW/DQ (own output driver during its own READ),
# pdqWR = 4.15 mW/DQ (own ODT while being WRITTEN). DC power per pin is
# roughly rate-independent, so pJ/bit = mW/DQ / data-rate:
#   read  11.73 mW / 3.2 Gb/s = 3.67 pJ/bit
#   write  4.15 mW / 3.2 Gb/s = 1.30 pJ/bit
# https://web.archive.org/web/2020/https://www.mouser.com/pdfDocs/tn4007_ddr4_power_calculation.pdf
# NOTE write < read: DDR4's POD12 termination is pull-up-only, so the written
# device pays only its ODT while the read device pays its full output driver.
# (DDR3's center-tapped termination gives the opposite order -- an easy trap.)
# Micron calls these "a first-order approximation"; they are DC estimates and
# ignore data-toggle dependence.
read  = 3.67
write = 1.30
