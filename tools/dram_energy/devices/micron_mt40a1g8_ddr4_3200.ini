# Micron MT40A1G8 -- 8Gb x8 DDR4-3200 (speed grade -062E).
#
# Device parameters only; the energy equations live in dram_energy.py. Copy this
# file to add another DRAM model -- see README.md "Adding a DRAM model".
#
# WARNING: these IDD values are representative figures for an 8Gb x8 DDR4-3200
# part, NOT transcribed from a specific datasheet revision. Verify them against
# the real part before quoting absolute Joules. One is known-odd and flagged
# below (idd4w).

[device]
name    = Micron MT40A1G8, 8Gb x8, DDR4-3200
part    = MT40A1G8
source  = representative DDR4-3200 values (see WARNING above)
verified = false

[organization]
# A 64-bit rank is 8 x8 devices; BL8 moves one 64B line per rank access.
devices_per_rank = 8
burst_transfers  = 8
line_bits        = 512
# The data rate these timings and currents describe. dram_energy.py rescales
# only the burst time for other rates and warns; swap the profile for a serious
# study at another speed grade.
data_rate_mtps   = 3200

[voltage_v]
vdd = 1.2
# DDR4 adds a separate 2.5V wordline-boost rail, used by the activate term.
vpp = 2.5

[current_ma]
# Per device. IDD0 is averaged over tRC and already contains the background
# current, which the ACT equation subtracts back out.
idd0  = 65
idd2n = 34
idd3n = 52
idd4r = 200
# NOTE: idd4w < idd4r is atypical (writes usually cost at least as much as
# reads). Kept as-is for continuity with earlier results; writes are a small
# share of total energy, so it barely moves any comparison. Fix when the
# datasheet values are transcribed.
idd4w = 160
idd5b = 175
ipp0  = 3.0

[timing_ns]
tras  = 32
trc   = 45.75
trfc  = 350
trefi = 7800

[io_pj_per_bit]
# NOT from the Micron note -- a literature approximation standing in for
# I/O drivers and ODT/termination. The weakest assumption in the model.
read  = 4.0
write = 6.0
