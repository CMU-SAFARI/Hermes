# Hermes-Uncore-Big — frozen shipping configuration (campaign 1 closeout,
# 2026-07-09). Total predictor storage ~29.6 KB (page buffer + weight tables).
# Layer ON TOP of ocp_hermes.ini:
#   --config=config/ocp_hermes.ini --config=config/hermes_uncore_big.ini
# Tuning evidence: runs/tuning campaign1 CLOSEOUT.md (origin/tuning).

# placement: shared uncore predictor beside the LLC, physical address
offchip_pred_location = uncore
ocp_perc_use_physical_address = true

# feature set: PageSpatialFootprint(20) + PageMissRatio(21) + LastNDeltas(22)
ocp_perc_activated_features = 20,21,22
ocp_perc_feature_hash_types = 2,2,2
ocp_perc_feature_region_size_log2s = 21,21,21

# storage split (this is what distinguishes Big/Normal/Lite)
ocp_perc_weight_array_sizes = 8192,1024,16384
ocp_perc_page_buf_sets = 64
ocp_perc_page_buf_assoc = 16

# operating point
ocp_perc_activation_threshold = 2
ocp_perc_pos_train_thresh = 8
ocp_perc_neg_train_thresh = -21
